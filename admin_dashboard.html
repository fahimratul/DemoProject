<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin_dashboard.css">
    <link rel="stylesheet" href="css/notification.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel='icon' href='static/logo_small.png' type='image/x-icon' />
    <title>Admin Dashboard</title>
</head>
<body>

    <nav>
        <ul>
            <li><a href="admin_dashboard.html" class="active">Dashboard</a></li>
            <li><a href="user_management.html">User Management</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div id="notification-toast" class="notification-toast"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading Dashboard</div>
        <div class="loading-subtext">Please wait...</div>
    </div>

    <h1 id="title">Admin Dashboard</h1>

    <!-- Stats Cards -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon"><i data-lucide="users"></i></div>
            <div class="stat-info">
                <h2 id="totalUsers">0</h2>
                <p>Total Users</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i data-lucide="warehouse"></i></div>
            <div class="stat-info">
                <h2 id="totalStores">0</h2>
                <p>Total Stores</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i data-lucide="shield"></i></div>
            <div class="stat-info">
                <h2 id="totalOfficers">0</h2>
                <p>Officers</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i data-lucide="hard-hat"></i></div>
            <div class="stat-info">
                <h2 id="totalStoremen">0</h2>
                <p>Storemen</p>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tab-container">
        <button class="tab-btn active" data-tab="users" onclick="switchTab('users')"><i data-lucide="users"></i> Users</button>
        <button class="tab-btn" data-tab="stores" onclick="switchTab('stores')"><i data-lucide="warehouse"></i> Stores</button>
    </div>

    <!-- Users Section -->
    <div id="usersSection" class="section active">
        <div class="section-header">
            <h2>All Users</h2>
            <div class="search-box">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="userSearchInput" placeholder="Search users..." oninput="filterUsers()">
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>BA Number</th>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Store</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Stores Section -->
    <div id="storesSection" class="section">
        <div class="section-header">
            <h2>Stores</h2>
            <button class="action-btn" onclick="openCreateStoreModal()"><i data-lucide="plus"></i> Create New Store</button>
        </div>
        <div class="stores-grid" id="storesGrid">
            <!-- Store cards rendered here -->
        </div>
    </div>

    <!-- Create Store Modal -->
    <div id="createStoreModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>Create New Store</h2>
                <button class="modal-close" onclick="closeModal('createStoreModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="storeName">Store Name</label>
                    <input type="text" id="storeName" placeholder="e.g. Engineer Store">
                </div>
                <div class="form-group">
                    <label for="storeCode">Store Code</label>
                    <input type="text" id="storeCode" placeholder="e.g. engr_store">
                </div>
                <div class="form-group">
                    <label for="storeDescription">Description</label>
                    <textarea id="storeDescription" rows="3" placeholder="Brief description of the store"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" onclick="closeModal('createStoreModal')">Cancel</button>
                <button class="btn primary" onclick="createStore()">Create Store</button>
            </div>
        </div>
    </div>

    <!-- Assign Personnel Modal -->
    <div id="assignModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="assignModalTitle">Assign Personnel</h2>
                <button class="modal-close" onclick="closeModal('assignModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="assignType">Assign As</label>
                    <select id="assignType">
                        <option value="storeman">Storeman</option>
                        <option value="officer">Officer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignUser">Select User</label>
                    <select id="assignUser">
                        <option value="">-- Select a user --</option>
                    </select>
                </div>
                <input type="hidden" id="assignStoreCode" value="">
            </div>
            <div class="modal-footer">
                <button class="btn secondary" onclick="closeModal('assignModal')">Cancel</button>
                <button class="btn primary" onclick="assignPersonnel()">Assign</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function hideNotification() {
            const toast = document.getElementById("notification-toast");
            toast.classList.remove("show");
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(tabName + 'Section').classList.add('active');
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
    <script type="module" src="js/admin_dashboard.js" defer></script>
</body>
</html>
